<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dal Birbante – mapa</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #f3f3f3; }
    .marker {
      display: block;
      width: 46px;
      height: 46px;
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    const centerLat = 50.1431511;
    const centerLng = 14.5786469;
    const zoomLevel = 13;
    const pinIconUrl = "/images/pin.svg";

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/positron",
      center: [centerLng, centerLat],
      zoom: zoomLevel,
      attributionControl: false,
    });

    map.on("load", () => {
      // soft grayscale wash for a light B&W look
      const canvas = map.getCanvas();
      canvas.style.filter = "grayscale(1) contrast(1.05) brightness(1.02)";

      const el = document.createElement("div");
      el.className = "marker";
      el.style.backgroundImage = "url(" + pinIconUrl + ")";
      new maplibregl.Marker(el).setLngLat([centerLng, centerLat]).addTo(map);
    });
  </script>
</body>
</html>
