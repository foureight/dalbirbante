zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - rm -rf .next
        - npm ci
        - npm run build
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      # Persistent disk — admin CMS / orders survive deploys
      volume:
        hostname: vol
        mountPath: /data
        readOnly: false
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NODE_OPTIONS: "--max-old-space-size=384"
        DATA_DIR: /data
      start: npm start
